[project]
name = "maldi"
version = "0.1.0"
description = "MALDI controller"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "contourpy>=1.3.3",
    "cycler>=0.12.1",
    "fluigent-sdk",
    "fonttools>=4.61.1",
    "kiwisolver>=1.4.9",
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "opencv-python>=4.13.0.92",
    "packaging>=26.0",
    "pandas>=3.0.1",
    "pillow>=12.1.1",
    "pyparsing>=3.3.2",
    "pypylon>=26.1.0",
    "pyserial>=3.5",
    "pyside6>=6.10.2",
    "pyside6-addons>=6.10.2",
    "pyside6-essentials>=6.10.2",
    "python-dateutil>=2.9.0.post0",
    "shiboken6>=6.10.2",
    "six>=1.17.0",
    "tzdata>=2025.3",
]

[tool.uv.workspace]
members = [
    "fluigent_sdk-23.0.0",
]

[tool.uv.sources]
fluigent-sdk = { workspace = true }

[tool.uv]
python-downloads = "automatic"